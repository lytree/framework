name: publish

on:
  push:
    tags:
      # 全量发布：V2.0.0-alpha.1 → 打包并推送 src 下所有包
      - '[Vv]*'
      # 单包发布：YLFramework.Repository/v2.0.0-alpha.1 → 只发布该包
      - 'YLFramework.*/v*'

jobs:
    ubuntu-latest:
        name: ubuntu-latest
        runs-on: ubuntu-latest
        # 与 nuget.org 的 Trusted Publishing 策略保持一致（策略里 Environment = release）
        environment: release
        permissions:
            contents: read
            id-token: write # NuGet Trusted Publishing 需要 OIDC token
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  submodules: recursive
            - name: 🛠️ Setup .NET 10 SDK
              uses: actions/setup-dotnet@v4
              with:
                  # ⬇️ 更改这一行以指定 .NET 10
                  # '10.0.x' 会安装 .NET 10 的最新版本
                  dotnet-version: "10.0.x"
            - name: 🏷️ Parse tag
              id: tag
              run: |
                  TAG="${GITHUB_REF_NAME}"
                  if [[ "$TAG" == */* ]]; then
                      PKG="${TAG%%/*}"
                      VER="${TAG##*/}"
                      VER="${VER#v}"
                      echo "package=$PKG" >> "$GITHUB_OUTPUT"
                      echo "version=$VER" >> "$GITHUB_OUTPUT"
                      echo "单包发布：$PKG @ $VER"
                  else
                      echo "package=" >> "$GITHUB_OUTPUT"
                      echo "version=" >> "$GITHUB_OUTPUT"
                      echo "全量发布：$TAG（版本取自各包 csproj 的 <Version>）"
                  fi
            - name: 🔐 NuGet login (OIDC → 临时 API Key)
              id: nuget-login
              uses: NuGet/login@v1
              with:
                  # nuget.org 账号名（profile name），不是邮箱
                  user: lytree
            - name: "Run: Push"
              run: |
                  if [ -n "${{ steps.tag.outputs.package }}" ]; then
                      dotnet run build/Build.cs -t Push --Package="${{ steps.tag.outputs.package }}" --Version="${{ steps.tag.outputs.version }}"
                  else
                      dotnet run build/Build.cs -t Push
                  fi
              env:
                  # 临时 Key 有效期 1 小时，由 NuGet/login 从 OIDC token 换取
                  NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
            - name: "Publish: package"
              uses: actions/upload-artifact@v4
              with:
                  name: package
                  path: nugets
